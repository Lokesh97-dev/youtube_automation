name: Daily Video Generation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
  # Phase 2: uncomment once MVP output quality has been reviewed and approved.
  # schedule:
  #   - cron: "0 6 * * *"  # 06:00 UTC daily

permissions:
  contents: write

# Two runs committing to docs/data/videos.json concurrently would conflict.
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve run date
        id: run_date
        # Input is passed via env, not interpolated into the script body.
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "${INPUT_DATE}" ]; then
            if ! date -d "${INPUT_DATE}" +%F >/dev/null 2>&1; then
              echo "Invalid date input: ${INPUT_DATE}" >&2
              exit 1
            fi
            RESOLVED="${INPUT_DATE}"
          else
            RESOLVED="$(date -u +%F)"
          fi
          echo "value=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_DATE: ${{ steps.run_date.outputs.value }}
        run: python scripts/run_pipeline.py --date "$RUN_DATE"

      - name: Commit dashboard status update
        if: always()
        env:
          RUN_DATE: ${{ steps.run_date.outputs.value }}
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/videos.json docs/videos
          if git diff --cached --quiet; then
            echo "No status change to commit."
            exit 0
          fi
          git commit -m "Update pipeline status for ${RUN_DATE} [skip ci]"
          # The branch may have moved since checkout; rebase before pushing.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "Failed to push status update after 3 attempts." >&2
          exit 1

      - name: Upload video artifact
        if: steps.pipeline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.run_date.outputs.value }}
          path: |
            out/${{ steps.run_date.outputs.value }}/video/final.mp4
            out/${{ steps.run_date.outputs.value }}/thumbnail/thumb.jpg
            out/${{ steps.run_date.outputs.value }}/description.txt
            out/${{ steps.run_date.outputs.value }}/tags.txt
            out/${{ steps.run_date.outputs.value }}/UPLOAD_CHECKLIST.txt
          retention-days: 7

      - name: Fail workflow if pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
