# Rotating theme categories. stage_01_topic.py picks one deterministically
# by (day_of_year % len(categories)) so the *type* of lesson varies
# systematically instead of relying purely on LLM randomness.
#
# The category count and the history window below are the main defence
# against YouTube's repetitive/mass-produced content policy. More categories
# = longer gap before a theme repeats; a larger history window = the model
# sees more of what it already wrote and is told not to repeat it.
# Do not shrink these without a good reason.

categories:
  - id: sharing
    label: "Sharing & Generosity"
    prompt_hint: "a story about sharing something with a friend or sibling"
  - id: counting
    label: "Counting & Numbers"
    prompt_hint: "a story that teaches counting from 1 to 10 through a fun activity"
  - id: manners
    label: "Manners & Politeness"
    prompt_hint: "a story about saying please, thank you, or being polite"
  - id: colors
    label: "Colors & Shapes"
    prompt_hint: "a story that teaches recognizing colors or shapes through play"
  - id: kindness
    label: "Kindness & Empathy"
    prompt_hint: "a story about being kind to someone who is sad, new, or different"
  - id: courage
    label: "Courage & Trying New Things"
    prompt_hint: "a story about being brave enough to try something new"
  - id: honesty
    label: "Honesty & Trust"
    prompt_hint: "a story about telling the truth even when it's hard"
  - id: friendship
    label: "Friendship & Teamwork"
    prompt_hint: "a story about working together with friends to solve a small problem"
  - id: nature
    label: "Nature & Animals"
    prompt_hint: "a story exploring the outdoors, seasons, or animal friends"
  - id: routines
    label: "Healthy Routines"
    prompt_hint: "a story about a bedtime, mealtime, or cleanup routine"
  - id: patience
    label: "Patience & Waiting"
    prompt_hint: "a story about waiting for something worth waiting for"
  - id: sharing_feelings
    label: "Naming Feelings"
    prompt_hint: "a story about noticing and naming a big feeling like sad, cross, or excited"
  - id: helping
    label: "Helping & Responsibility"
    prompt_hint: "a story about taking care of a small job or helping someone who needs it"
  - id: alphabet
    label: "Letters & Sounds"
    prompt_hint: "a story that plays with letter sounds or spotting a letter in the world"
  - id: opposites
    label: "Opposites & Comparisons"
    prompt_hint: "a story built around opposites like big/small, fast/slow, loud/quiet"
  - id: weather
    label: "Weather & Seasons"
    prompt_hint: "a story about a kind of weather or a change of season"
  - id: food
    label: "Food & Trying New Tastes"
    prompt_hint: "a story about trying an unfamiliar food or growing something to eat"
  - id: apologies
    label: "Mistakes & Apologies"
    prompt_hint: "a story about making a small mistake and putting it right"
  - id: curiosity
    label: "Curiosity & Questions"
    prompt_hint: "a story about wondering why and finding out the answer"
  - id: quiet
    label: "Calm & Quiet Moments"
    prompt_hint: "a gentle story about slowing down, resting, or noticing small things"

# How many recent titles/premises are shown to the LLM as "do not repeat this".
# Should comfortably exceed len(categories) so the model sees several full
# rotations of history, not just the current cycle.
recent_history_window: 90

# difflib.SequenceMatcher ratio above which a new title is considered a
# near-duplicate and triggers a re-prompt.
similarity_reject_threshold: 0.82

# How many times to re-prompt when the model returns a near-duplicate before
# failing the stage.
max_duplicate_retries: 3
